<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Damage Classification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            flex-direction: column;
        }
        footer {
            margin-top: auto;
        }
        #fileInput {
            display: none;
        }
    </style>
</head>
<body class="bg-light">


    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">

            <a class="navbar-brand fw-bold" href="{% url 'classify' %}">Car Damage App</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{% url 'classify' %}">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/stats/' %}active{% endif %}" href="{% url 'stats' %}">
                            Statistics
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        
                        <h3 class="text-center mb-4">Upload Image</h3>

                        {% if not result %}
                        <form action="/classify/" method="POST" enctype="multipart/form-data">
                            {% csrf_token %}
                            
                            <div class="mb-3 text-center">
                                <label for="fileInput"
                                    class="btn btn-light px-4 py-2 border border-2 rounded-3"
                                    style="border-style: dashed; font-weight: 600;">
                                    📁 Choose Image
                                </label>
                                <input id="fileInput" type="file" name="image" accept="image/*" class="d-none">
                            </div>
                            
                            <button id="submitBtn" type="submit" class="btn btn-primary w-100">Classify</button>
                            </form>
                            {% else %}
                            <div class="text-center mt-4">
                                <a href="{% url 'classify' %}"
                                class="btn btn-outline-primary px-4 py-2 rounded-3"
                                style="font-weight: 600;">
                                    Upload new image
                                </a>
                            </div>
                            {% endif %}

                        <img id="preview" src="#" alt="Image preview" class="img-fluid mt-3 d-none rounded shadow-sm">
                        <p id="fileName" class="text-muted small mt-2"></p>

                        {% if result %}
                            <img src="{{ image_url }}" class="img-fluid mt-3 rounded shadow-sm">
                            <div class="alert alert-info text-center mt-4">
                                <strong>Prediction:</strong> {{ result }}
                            </div>
                        {% endif %}
                    </div>
                </div>
            </div>

        </div>
    </div>    

    <footer class="bg-dark text-white text-center py-3">
        <small>Car Damage Classification • RUAP Project • {{ now|date:"Y" }}</small>
    </footer>

    <script>
        document.querySelector("form").addEventListener("submit", function (e) {
            const fileInput = document.getElementById("fileInput");

            if (!fileInput.files.length) {
                e.preventDefault();
                alert("Please select an image before classifying.");
                return;
            }

            const btn = document.getElementById("submitBtn");
            btn.disabled = true;
            btn.innerHTML = `
                <span class="spinner-border spinner-border-sm me-2"></span>
                Classifying...
            `;
        });

        document.addEventListener("DOMContentLoaded", function () {
            const fileInput = document.querySelector('input[type="file"]');
            const preview = document.getElementById("preview");

            fileInput.addEventListener("change", function () {
                const file = this.files[0];
                if (file) {
                    preview.src = URL.createObjectURL(file);
                    preview.classList.remove("d-none");

                    document.getElementById("fileName").textContent = file.name;
                }
            });
        });
    </script>
</body>
</html>
